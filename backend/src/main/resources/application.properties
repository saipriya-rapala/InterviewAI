spring.application.name=InterviewAI
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/interviewai_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=8081

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.resume.storage-dir=${RESUME_STORAGE_DIR:${user.home}/.interviewai/resumes}

app.evaluation.mode=${EVALUATION_MODE:openai}

app.jwt.secret=${JWT_SECRET:dGhpc19pc19hX3Zlcnlfc2VjdXJlX2tleV9mb3JfaW50ZXJ2aWV3YWlfMzJieXRlcw==}
app.jwt.expiration-ms=3600000

app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.endpoint=${OPENAI_API_ENDPOINT:https://api.openai.com/v1/chat/completions}
app.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
app.ai.openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:45}
